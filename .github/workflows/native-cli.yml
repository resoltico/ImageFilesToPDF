name: Native CLI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # One npm tarball, packed from the committed files with the pinned npm, is
  # installed on every platform below: the same bytes the release ships.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      - run: npm run check-dist
      - run: mkdir npm-package && node tools/npm-package.mjs npm-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: npm-package/
          if-no-files-found: error

  linux:
    # The arm64 entry keeps the name "linux", which branch protection requires.
    name: ${{ matrix.name }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04-arm
          - name: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      - run: npm run check-dist
      - run: docker build -t iftp-native - < tests/integration/linux-native.Dockerfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package
      - name: Verify the committed CLI on Linux
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v /tmp -w /repo iftp-native sh -ec '
            uname -m
            df -T /tmp /dev/shm
            node --version
            vips --version
            pdfcpu version
            IFTP_SECOND_VOLUME=/dev/shm node tests/integration/native-cli.cjs
            python3 tests/integration/posix-process.py
          '
          docker run --rm --user node -v "$PWD:/repo:ro" -w /repo iftp-native \
            python3 tests/integration/linux-recovery.py
      - name: Install and run the npm package with the image's own npm
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo iftp-native sh -ec '
            npm --version
            node tests/integration/npm-route.cjs npm-package/image-files-to-pdf-*.tgz
          '

  windows:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        check: [artifact, console, arguments, cards, npm]
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global (node --print "require('./package.json').packageManager")
      - run: npm ci --ignore-scripts
      - run: npm run check-dist
      - run: ./tests/integration/windows-tools.ps1
      - name: Verify Windows, NTFS, tools and PowerShell transport
        run: |
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture
          Get-Volume | Format-Table DriveLetter,FileSystem,DriveType
          node --version
          vips --version
          pdfcpu version
          qpdf --version
          ./tests/integration/powershell.ps1
      - name: Verify the committed CLI on NTFS
        if: matrix.check == 'artifact'
        env:
          IFTP_HEVC_UNAVAILABLE: "1"
        run: node tests/integration/native-cli.cjs
      - name: Verify dehydrated Cloud Files placeholders
        if: matrix.check == 'artifact'
        timeout-minutes: 5
        run: ./tests/integration/windows-cloud-files.ps1
      - name: Verify the helper process budget, hidden entries, and long paths
        if: matrix.check == 'artifact' && !cancelled()
        run: ./tests/integration/windows-engine.ps1
      - name: Verify recovery after a denied NTFS claim
        if: matrix.check == 'artifact' && !cancelled()
        run: ./tests/integration/windows-recovery.ps1
      - name: Verify publication across two NTFS volumes
        if: matrix.check == 'artifact' && !cancelled()
        run: ./tests/integration/windows-volume.ps1
      - name: Verify exclusive publication to FAT32
        if: matrix.check == 'cards'
        run: ./tests/integration/windows-volume.ps1 -FileSystem FAT32
      - name: Verify exclusive publication to exFAT
        if: matrix.check == 'cards' && !cancelled()
        run: ./tests/integration/windows-volume.ps1 -FileSystem exFAT
      - name: Verify PowerShell console Ctrl+C
        if: matrix.check == 'console'
        run: ./tests/integration/windows-console.ps1
      - name: Verify Windows restart with a live decoder
        if: matrix.check == 'console' && !cancelled()
        run: ./tests/integration/windows-console.ps1 -Scenario Crash
      - name: Verify Windows source replacement at capture
        if: matrix.check == 'console' && !cancelled()
        run: ./tests/integration/windows-console.ps1 -Scenario Change
      - name: Verify Windows argv batching
        if: matrix.check == 'arguments'
        env:
          IFTP_LONG_WINDOWS_ONLY: "1"
        run: node tests/integration/native-cli.cjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.check == 'npm'
        with:
          name: npm-package
          path: npm-package
      - name: Install and run the npm package
        if: matrix.check == 'npm'
        run: ./tests/integration/windows-npm.ps1 -Tarball (Get-Item npm-package/image-files-to-pdf-*.tgz).FullName
      - name: Verify console Ctrl+C through the npm .cmd launcher
        if: matrix.check == 'npm' && !cancelled()
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'npm-shim'
          npm install --global --prefix $prefix (Get-Item npm-package/image-files-to-pdf-*.tgz).FullName
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed.' }
          ./tests/integration/windows-console.ps1 -Scenario Shim -Command (Join-Path $prefix 'image-files-to-pdf.cmd')

  # x86-64 is where most Windows users are; a smoke run of the npm route and
  # the native CLI suite on the x64 builds of the same tools.
  windows-x64:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global (node --print "require('./package.json').packageManager")
      - run: npm ci --ignore-scripts
      - run: npm run check-dist
      - run: ./tests/integration/windows-tools.ps1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package
      - name: Install and run the npm package
        run: ./tests/integration/windows-npm.ps1 -Tarball (Get-Item npm-package/image-files-to-pdf-*.tgz).FullName
      - name: Verify the committed CLI on NTFS
        if: ${{ !cancelled() }}
        env:
          IFTP_HEVC_UNAVAILABLE: "1"
        run: node tests/integration/native-cli.cjs
