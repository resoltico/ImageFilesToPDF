name: Release

# Tags only. There is no workflow_dispatch: every step below is about a
# specific version, and a manual run from a branch has no tag to check.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify the tagged source
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No package cache in release jobs: the attested artifact is built from a clean install.
          package-manager-cache: false
      # Runner images may contain stale Homebrew metadata.
      - run: brew update
      - run: brew install vips pdfcpu qpdf poppler libtiff exiftool shellcheck actionlint
      - run: node tools/check-pdfcpu.mjs
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      # The tag is a claim about which version is shipping, and it is the one
      # claim the repository cannot contradict on its own.
      - run: node tools/check-tag.mjs "$RELEASE_TAG"
      # Verifies the committed artifact against src/ rather than rebuilding
      # it, so a stale dist/ fails here instead of shipping.
      - run: npm run quality
      - name: Verify the Finder client and CLI on macOS
        run: npm run test:integration:macos

  native-cli:
    uses: ./.github/workflows/native-cli.yml

  build:
    name: Build the artifact on CI
    needs: [qualify, native-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No package cache in release jobs: the attested artifact is built from a clean install.
          package-manager-cache: false
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      - run: node tools/check-tag.mjs "$RELEASE_TAG"
      # Prove the committed artifact matches src/ before touching it, because
      # building first would make that comparison vacuous.
      - run: npm run check-dist
      - run: npm run build
      # The build is a scoped esbuild bundle from the pinned compiler, with no
      # timestamps or absolute paths in its output, so rebuilding on a clean
      # runner must reproduce the committed bytes exactly. This is what makes
      # the attestation below worth having: what is signed is both built here
      # and identical to what was reviewed in the repository.
      - name: Require the build to be reproducible
        run: git diff --exit-code -- dist/
      # The npm package is assembled from the committed files just verified.
      # The release manifest is the committed one plus the tarball, so one
      # SHA256SUMS covers every file the release offers.
      - name: Pack the npm package and list it in the release manifest
        run: |
          mkdir release
          cp dist/Image-Files-to-PDF.jxa dist/Image-Files-to-PDF.cjs release/
          tarball=$(node tools/npm-package.mjs release)
          cp dist/SHA256SUMS release/SHA256SUMS
          (cd release && sha256sum "$(basename "$tarball")" >> SHA256SUMS)
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: release/
          if-no-files-found: error

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: release
      # The artifact traveled through the runner's storage, so its checksums
      # are checked again on arrival rather than trusted. The manifest names
      # its files without a directory, so it verifies from beside them.
      - name: Reverify the downloaded artifact
        working-directory: release
        run: shasum --check SHA256SUMS
      - name: Name the npm tarball
        run: |
          set -- release/image-files-to-pdf-*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one npm tarball" >&2; exit 1; }
          echo "NPM_TARBALL=$1" >> "$GITHUB_ENV"
      # Every file this release offers, each one a subject in its own right.
      # Attesting the manifest alone would cover what the manifest lists --
      # the artifact -- and leave the manifest and the instructions uncovered,
      # while each is a file a person downloads and relies on.
      - name: Attest the artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/Image-Files-to-PDF.jxa
            release/Image-Files-to-PDF.cjs
            release/image-files-to-pdf-*.tgz
            release/SHA256SUMS
            INSTALL.txt
            LICENSE
      # Verified here rather than trusted: an attestation that does not verify
      # is worth less than none, because it is the thing a user is told to
      # check. Before the release exists, so a failure publishes nothing.
      - name: Verify the attestation before publishing
        run: |
          for subject in release/Image-Files-to-PDF.jxa release/Image-Files-to-PDF.cjs "$NPM_TARBALL" release/SHA256SUMS INSTALL.txt LICENSE; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY"
          done
      # A tag can be moved after it is pushed. This proves the tag still
      # resolves to the commit this run was started for, and --verify-tag
      # makes the release itself refuse a tag that has since changed.
      - name: Require the tag to still point at this commit
        run: |
          object_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha')
          object_type=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.type')
          if [ "$object_type" = "tag" ]; then
            object_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.sha')
          fi
          if [ "$object_sha" != "$GITHUB_SHA" ]; then
            echo "tag $RELEASE_TAG no longer points at $GITHUB_SHA" >&2
            exit 1
          fi
      # The notes come from CHANGELOG.md, which the gate already keeps in
      # agreement with the version, rather than from a second file that would
      # have to be kept in agreement with the CHANGELOG.
      - name: Extract the release notes
        run: >-
          node tools/release-notes.mjs "$RELEASE_TAG"
          > "$RUNNER_TEMP/release-notes.md"
      - name: Create the release
        run: |
          gh release create "$RELEASE_TAG" \
            release/Image-Files-to-PDF.jxa \
            release/Image-Files-to-PDF.cjs \
            "$NPM_TARBALL" \
            release/SHA256SUMS \
            INSTALL.txt \
            LICENSE \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Image Files to PDF ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Report npm staging
        env:
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$NPM_TRUSTED_PUBLISHING" = "enabled" ]; then
            echo "The npm job stages this version for owner approval on npmjs.com."
          else
            echo "::notice::npm staging is off: the owner publishes the first version and then sets NPM_TRUSTED_PUBLISHING=enabled."
          fi

  # Stages the attested tarball on npm through trusted publishing (OIDC): no
  # token exists anywhere. A staged version goes live only when the owner
  # approves it on npmjs.com with 2FA. Off until the owner has published the
  # first version and configured this workflow as the package's trusted
  # publisher, because npm only offers that setting for an existing package.
  npm:
    name: Stage the npm package
    needs: publish
    if: vars.NPM_TRUSTED_PUBLISHING == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No package cache in a publishing job; nothing is installed from npm here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # npm stage publish needs npm 11.15.0 or later; the repository pins npm 12.
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: release
      - name: Verify the tarball before staging it
        working-directory: release
        run: |
          shasum --check SHA256SUMS
          set -- image-files-to-pdf-*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one npm tarball" >&2; exit 1; }
          gh attestation verify "$1" --repo "$GITHUB_REPOSITORY"
          echo "NPM_TARBALL=$PWD/$1" >> "$GITHUB_ENV"
      - name: Stage the version for owner approval
        run: npm stage publish "$NPM_TARBALL" --access public
