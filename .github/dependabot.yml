version: 2
updates:
  # The workflow pins actions to commit SHAs, which is the right thing to do
  # but means nothing updates them on its own. Dependabot rewrites the pin and
  # its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # The artifact has no runtime dependencies -- it is one file that shells out
  # to vips and pdfcpu -- so everything here is a build or gate tool: eslint,
  # stryker and acorn. A change to any of them changes what the gate accepts or
  # what the build emits, which is worth a pull request rather than a surprise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    labels:
      - dependencies
